<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1 class="app-title">할 일 목록</h1>

    <!-- 날짜 이동 영역 -->
    <div class="date-nav">
      <button id="prev-day" class="date-button">‹</button>
      <span id="current-date" class="current-date"></span>
      <button id="next-day" class="date-button">›</button>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="할 일을 입력하세요"
      />
      <button id="add-button" class="add-button">추가</button>
    </div>

    <p id="message" class="message"></p>

    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">전체</button>
      <button class="filter-tab" data-filter="active">진행 중</button>
      <button class="filter-tab" data-filter="completed">완료</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
